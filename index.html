<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Boids</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a1a; overflow: hidden; }
  canvas { display: block; }
  #controls {
    position: fixed; top: 10px; left: 10px; color: #aaf;
    font: 13px monospace; background: rgba(0,0,20,0.7);
    padding: 10px; border-radius: 6px; user-select: none;
  }
  label { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  input[type=range] { width: 100px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="controls">
  <b>BOIDS</b><br><br>
  <label>Count <input type="range" id="count" min="10" max="500" value="150"></label>
  <label>Speed <input type="range" id="speed" min="1" max="8" value="3" step="0.5"></label>
  <label>Separation <input type="range" id="sep" min="10" max="60" value="25"></label>
  <label>Alignment <input type="range" id="ali" min="0" max="2" value="0.8" step="0.1"></label>
  <label>Cohesion <input type="range" id="coh" min="0" max="2" value="0.5" step="0.1"></label>
  <label>Vision <input type="range" id="vis" min="20" max="150" value="80"></label>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const cfg = {
  get count() { return +document.getElementById('count').value; },
  get speed() { return +document.getElementById('speed').value; },
  get sep()   { return +document.getElementById('sep').value; },
  get ali()   { return +document.getElementById('ali').value; },
  get coh()   { return +document.getElementById('coh').value; },
  get vis()   { return +document.getElementById('vis').value; },
};

class Boid {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    const a = Math.random() * Math.PI * 2;
    const s = cfg.speed;
    this.vx = Math.cos(a) * s;
    this.vy = Math.sin(a) * s;
    this.hue = Math.random() * 60 + 180;
  }
}

let boids = Array.from({length: 150}, () => new Boid());

function update() {
  const target = cfg.count;
  while (boids.length < target) boids.push(new Boid());
  if (boids.length > target) boids.length = target;

  const VIS = cfg.vis;
  const VIS2 = VIS * VIS;
  const SEP = cfg.sep;
  const SEP2 = SEP * SEP;
  const ALI = cfg.ali;
  const COH = cfg.coh;
  const MAX = cfg.speed;

  for (const b of boids) {
    let sx=0, sy=0, ax=0, ay=0, cx=0, cy=0, ns=0, na=0;
    for (const o of boids) {
      if (o === b) continue;
      let dx = o.x - b.x, dy = o.y - b.y;
      // wrap distance
      if (dx > W/2) dx -= W; if (dx < -W/2) dx += W;
      if (dy > H/2) dy -= H; if (dy < -H/2) dy += H;
      const d2 = dx*dx + dy*dy;
      if (d2 < VIS2) {
        na++;
        ax += o.vx; ay += o.vy;
        cx += dx; cy += dy;
        if (d2 < SEP2 && d2 > 0) {
          const d = Math.sqrt(d2);
          sx -= dx/d; sy -= dy/d;
        }
      }
    }
    let fx = 0, fy = 0;
    if (na > 0) {
      fx += (ax/na - b.vx) * ALI;
      fy += (ay/na - b.vy) * ALI;
      fx += (cx/na) * COH * 0.01;
      fy += (cy/na) * COH * 0.01;
    }
    fx += sx * 0.1;
    fy += sy * 0.1;

    b.vx += fx;
    b.vy += fy;
    const spd = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
    if (spd > 0) { b.vx = b.vx/spd*MAX; b.vy = b.vy/spd*MAX; }

    b.x = (b.x + b.vx + W) % W;
    b.y = (b.y + b.vy + H) % H;
  }
}

function draw() {
  ctx.fillStyle = 'rgba(10,10,26,0.25)';
  ctx.fillRect(0, 0, W, H);

  for (const b of boids) {
    const angle = Math.atan2(b.vy, b.vx);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(8, 0);
    ctx.lineTo(-5, 3);
    ctx.lineTo(-5, -3);
    ctx.closePath();
    ctx.fillStyle = `hsla(${b.hue},80%,65%,0.9)`;
    ctx.fill();
    ctx.restore();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
