<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Boids</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  #ui{position:fixed;top:8px;left:8px;color:#9ab;font:12px/1.3 system-ui;background:rgba(0,0,0,.35);padding:8px 10px;border-radius:6px}
  #ui label{display:block;margin:2px 0}
  input[type=range]{vertical-align:middle}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div><b>Boids</b> · <span id="n">0</span></div>
  <label>Sep <input id="sep" type="range" min="0" max="3" step="0.05" value="1.5"></label>
  <label>Ali <input id="ali" type="range" min="0" max="3" step="0.05" value="1.0"></label>
  <label>Coh <input id="coh" type="range" min="0" max="3" step="0.05" value="1.0"></label>
  <label>Speed <input id="spd" type="range" min="1" max="6" step="0.1" value="3"></label>
  <div>click=add · shift+click=clear</div>
</div>
<script>
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
let W,H;function resize(){W=cvs.width=innerWidth;H=cvs.height=innerHeight}
addEventListener('resize',resize);resize();

const sep=document.getElementById('sep'),ali=document.getElementById('ali'),
      coh=document.getElementById('coh'),spd=document.getElementById('spd'),
      nlbl=document.getElementById('n');

const PERC=50, SEPR=24;
const boids=[];
function spawn(n,x,y){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    boids.push({x:x??Math.random()*W,y:y??Math.random()*H,
      vx:Math.cos(a)*2,vy:Math.sin(a)*2});
  }
}
spawn(180);

cvs.addEventListener('click',e=>{
  if(e.shiftKey){boids.length=0;return}
  spawn(30,e.clientX,e.clientY);
});

function step(){
  const max=parseFloat(spd.value),ws=parseFloat(sep.value),
        wa=parseFloat(ali.value),wc=parseFloat(coh.value);
  for(const b of boids){
    let ax=0,ay=0,vx=0,vy=0,cx=0,cy=0,nA=0,nC=0;
    let sx=0,sy=0;
    for(const o of boids){
      if(o===b)continue;
      const dx=o.x-b.x,dy=o.y-b.y,d2=dx*dx+dy*dy;
      if(d2<PERC*PERC){
        vx+=o.vx;vy+=o.vy;cx+=o.x;cy+=o.y;nA++;
        if(d2<SEPR*SEPR&&d2>0){
          const d=Math.sqrt(d2);sx-=dx/d;sy-=dy/d;
        }
      }
    }
    if(nA>0){
      vx/=nA;vy/=nA;cx=cx/nA-b.x;cy=cy/nA-b.y;
      ax+=(vx-b.vx)*0.05*wa;
      ay+=(vy-b.vy)*0.05*wa;
      ax+=cx*0.0008*wc;
      ay+=cy*0.0008*wc;
    }
    ax+=sx*0.08*ws;ay+=sy*0.08*ws;
    b.vx+=ax;b.vy+=ay;
    const sp=Math.hypot(b.vx,b.vy);
    if(sp>max){b.vx=b.vx/sp*max;b.vy=b.vy/sp*max}
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<0)b.x+=W;else if(b.x>W)b.x-=W;
    if(b.y<0)b.y+=H;else if(b.y>H)b.y-=H;
  }
}

function draw(){
  ctx.fillStyle='rgba(11,15,26,0.25)';ctx.fillRect(0,0,W,H);
  for(const b of boids){
    const a=Math.atan2(b.vy,b.vx);
    ctx.fillStyle='hsl('+((a*57.3+360)%360)+',80%,65%)';
    ctx.beginPath();
    ctx.moveTo(b.x+Math.cos(a)*6,b.y+Math.sin(a)*6);
    ctx.lineTo(b.x+Math.cos(a+2.6)*4,b.y+Math.sin(a+2.6)*4);
    ctx.lineTo(b.x+Math.cos(a-2.6)*4,b.y+Math.sin(a-2.6)*4);
    ctx.closePath();ctx.fill();
  }
  nlbl.textContent=boids.length;
}

(function loop(){step();draw();requestAnimationFrame(loop)})();
</script>
</body>
</html>
